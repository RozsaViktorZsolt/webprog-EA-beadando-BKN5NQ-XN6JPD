<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>SPA menü</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .tic-tac-toe-board { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; margin-top: 10px; }
        .tic-tac-toe-cell { width: 50px; height: 50px; font-size: 24px; cursor: pointer; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 50px); gap: 5px; margin-top: 10px; }
        .calc-btn { padding: 10px; font-size: 16px; cursor: pointer; }
        .spa-nav button { margin-right: 10px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Web programozás-1 Előadás Házi feladat</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="javascript.html">JavaScript menü</a></li>
            <li><a href="react.html">React menü</a></li>
            <li><a href="spa.html">SPA menü</a></li>
            <li><a href="fetchapi.html">Fetch API menü</a></li>
            <li><a href="axios.html">Axios menü</a></li>
            <li><a href="oojs.html">OOJS menü</a></li>
        </ul>
    </nav>
    <main>
        <h2>Egyoldalas Alkalmazás (SPA)</h2>
        <p>A React alkalmazások (Amőba és Számológép) helyi fejlesztői környezetben készültek el (Babel nélkül).</p>
        <a href="react/dist/index.html" target="_blank" style="display:inline-block; padding:10px 20px; background:#007BFF; color:white; text-decoration:none; border-radius:5px;">Játékok Megnyitása</a>
    </main>
    <script type="text/babel">
        const { useState } = React;

        // --- 1. Alkalmazás: Amőba (Tic-Tac-Toe) ---
        const TicTacToe = () => {
            const [board, setBoard] = useState(Array(9).fill(null));
            const [xIsNext, setXIsNext] = useState(true);

            const calculateWinner = (squares) => {
                const lines = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // sorok
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // oszlopok
                    [0, 4, 8], [2, 4, 6]             // átlók
                ];
                for (let i = 0; i < lines.length; i++) {
                    const [a, b, c] = lines[i];
                    if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                        return squares[a];
                    }
                }
                return null;
            };

            const handleClick = (i) => {
                const boardCopy = [...board];
                if (calculateWinner(boardCopy) || boardCopy[i]) return;
                boardCopy[i] = xIsNext ? 'X' : 'O';
                setBoard(boardCopy);
                setXIsNext(!xIsNext);
            };

            const winner = calculateWinner(board);
            const status = winner ? `Győztes: ${winner}` : `Következő játékos: ${xIsNext ? 'X' : 'O'}`;

            return (
                <div>
                    <h3>Amőba</h3>
                    <div>{status}</div>
                    <div className="tic-tac-toe-board">
                        {board.map((cell, i) => (
                            <button key={i} className="tic-tac-toe-cell" onClick={() => handleClick(i)}>
                                {cell}
                            </button>
                        ))}
                    </div>
                    <button style={{marginTop: '10px'}} onClick={() => setBoard(Array(9).fill(null))}>Újra</button>
                </div>
            );
        };

        // --- 2. Alkalmazás: Egyszerű Számológép ---
        const Calculator = () => {
            const [input, setInput] = useState('');

            const handleClick = (value) => {
                setInput(input + value);
            };

            const calculate = () => {
                try {
                    setInput(eval(input).toString()); // Figyelem: Az eval() éles rendszerben veszélyes lehet, de egy ilyen beadandóhoz megfelel.
                } catch (error) {
                    setInput("Hiba");
                }
            };

            const clear = () => {
                setInput('');
            };

            return (
                <div>
                    <h3>Számológép</h3>
                    <input type="text" value={input} readOnly style={{ width: '215px', padding: '5px', fontSize: '18px' }} />
                    <div className="calc-grid">
                        {['7', '8', '9', '/'].map(btn => <button key={btn} className="calc-btn" onClick={() => handleClick(btn)}>{btn}</button>)}
                        {['4', '5', '6', '*'].map(btn => <button key={btn} className="calc-btn" onClick={() => handleClick(btn)}>{btn}</button>)}
                        {['1', '2', '3', '-'].map(btn => <button key={btn} className="calc-btn" onClick={() => handleClick(btn)}>{btn}</button>)}
                        {['C', '0', '=', '+'].map(btn => (
                            <button 
                                key={btn} 
                                className="calc-btn" 
                                onClick={btn === 'C' ? clear : btn === '=' ? calculate : () => handleClick(btn)}
                            >
                                {btn}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Fő SPA Komponens ---
        const SPA = () => {
            const [activeApp, setActiveApp] = useState('tictactoe');

            return (
                <div>
                    <div className="spa-nav" style={{ marginBottom: '20px' }}>
                        <button onClick={() => setActiveApp('tictactoe')} style={{ fontWeight: activeApp === 'tictactoe' ? 'bold' : 'normal' }}>Amőba Játék</button>
                        <button onClick={() => setActiveApp('calculator')} style={{ fontWeight: activeApp === 'calculator' ? 'bold' : 'normal' }}>Számológép</button>
                    </div>
                    
                    <div style={{ padding: '20px', border: '1px solid #ccc', borderRadius: '5px' }}>
                        {activeApp === 'tictactoe' && <TicTacToe />}
                        {activeApp === 'calculator' && <Calculator />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('spa-root'));
        root.render(<SPA />);
    </script>
</body>
</html>
