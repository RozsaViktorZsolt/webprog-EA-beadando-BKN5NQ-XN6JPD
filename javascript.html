<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>JS CRUD - Tömbben</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>
    <h1>JavaScript CRUD műveletek (Adatok tömbben)</h1>
    
    <div id="form">
        <input type="text" id="klubNev" placeholder="Klub neve">
        <button onclick="hozzaad()">Hozzáadás</button>
    </div>

    <table id="klubTabla">
        <thead>
            <tr>
                <th>ID</th>
                <th>Csapatnév</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody id="tablaTest"></tbody>
    </tbody>
    </table>

    <script>
        // Kezdő adatok az nbi_labdarugas.sql alapján
        let klubok = [
            { id: 1, csapatnev: 'Vasas FC' },
            { id: 2, csapatnev: 'Ferencvárosi TC' },
            { id: 3, csapatnev: 'Puskás Akadémia' }
        ];

        function tablaRendereles() {
            const test = document.getElementById('tablaTest');
            test.innerHTML = '';
            klubok.forEach((klub, index) => {
                test.innerHTML += `
                    <tr>
                        <td>${klub.id}</td>
                        <td>${klub.csapatnev}</td>
                        <td><button onclick="torles(${index})">Törlés</button></td>
                    </tr>
                `;
            });
        }

        function hozzaad() {
            const nev = document.getElementById('klubNev').value;
            if (nev) {
                const ujKlub = { id: klubok.length + 1, csapatnev: nev };
                klubok.push(ujKlub);
                document.getElementById('klubNev').value = '';
                tablaRendereles();
            }
        }

        function torles(index) {
            klubok.splice(index, 1);
            tablaRendereles();
        }

        tablaRendereles();
    </script>
</body>
</html>
