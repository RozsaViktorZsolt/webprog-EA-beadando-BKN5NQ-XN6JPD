<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>OOJS menü</title>
    <style>
        .iranyito-pult { 
            margin: 20px 0; 
            padding: 15px; 
            background: #e9ecef; 
            border: 1px solid #ced4da; 
            border-radius: 5px;
            display: inline-block;
        }
        .iranyito-pult button {
            padding: 10px 15px;
            margin-right: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web programozás-1 Előadás Házi feladat</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="javascript.html">JavaScript menü</a></li>
            <li><a href="react.html">React menü</a></li>
            <li><a href="spa.html">SPA menü</a></li>
            <li><a href="fetchapi.html">Fetch API menü</a></li>
            <li><a href="axios.html">Axios menü</a></li>
            <li><a href="oojs.html">OOJS menü</a></li>
        </ul>
    </nav>
    <main>
        <h2>Objektumorientált JavaScript (OOJS)</h2>
        <p>Kattints a gombokra, hogy új játékosokat és labdákat helyezz el a képernyőn!</p>
        <div class="iranyito-pult">
            <button onclick="ujJatekos()">+ Új Játékos</button>
            <button onclick="ujLabda()">+ Új Labda</button>
        </div>
    </main>
    <script>
        // Ősosztály (Base class)
        class GrafikusElem {
            constructor(x, y, meret, szin) {
                this.x = x;
                this.y = y;
                this.meret = meret;
                this.szin = szin;
                this.elem = document.createElement('div');
            }

            // Metódus
            formaz() {
                this.elem.style.position = 'absolute';
                this.elem.style.left = this.x + 'px';
                this.elem.style.top = this.y + 'px';
                this.elem.style.width = this.meret + 'px';
                this.elem.style.height = this.meret + 'px';
                this.elem.style.backgroundColor = this.szin;
                this.elem.style.zIndex = -1; // Hogy a formák a szöveg mögé kerüljenek
            }

            // Metódus
            megjelenit() {
                this.formaz();
                // KÖTELEZŐ ELEM: document.body.appendChild
                document.body.appendChild(this.elem);
            }
        }

        // Gyermekosztály 1 - Játékos (extends használata)
        class Jatekos extends GrafikusElem {
            constructor(x, y, mezszam) {
                // KÖTELEZŐ ELEM: super()
                super(x, y, 60, '#d9534f'); // Pirosas szín
                this.mezszam = mezszam;
            }

            // Metódus felülírása (Polimorfizmus)
            formaz() {
                super.formaz(); // Az ősosztály formázásának meghívása
                this.elem.style.borderRadius = '50%';
                this.elem.style.color = 'white';
                this.elem.style.display = 'flex';
                this.elem.style.justifyContent = 'center';
                this.elem.style.alignItems = 'center';
                this.elem.style.fontWeight = 'bold';
                this.elem.style.fontSize = '20px';
                this.elem.style.boxShadow = '2px 2px 5px rgba(0,0,0,0.5)';
                this.elem.innerText = this.mezszam;
            }
        }

        // Gyermekosztály 2 - Labda
        class Labda extends GrafikusElem {
            constructor(x, y) {
                super(x, y, 40, 'white');
            }

            formaz() {
                super.formaz();
                this.elem.style.borderRadius = '50%';
                this.elem.style.border = '4px dashed black';
                this.elem.style.backgroundColor = '#f9f9f9';
                this.elem.style.boxSizing = 'border-box';
            }
        }

        // Vezérlő függvények a gombokhoz
        function ujJatekos() {
            // Véletlenszerű pozíció, hogy a gombok és a menü alatt jelenjenek meg (y > 300)
            let x = Math.floor(Math.random() * (window.innerWidth - 100));
            let y = Math.floor(Math.random() * (window.innerHeight - 350)) + 300;
            let mezszam = Math.floor(Math.random() * 99) + 1;
            
            let jatekos = new Jatekos(x, y, mezszam);
            jatekos.megjelenit();
        }

        function ujLabda() {
            let x = Math.floor(Math.random() * (window.innerWidth - 100));
            let y = Math.floor(Math.random() * (window.innerHeight - 350)) + 300;
            
            let labda = new Labda(x, y);
            labda.megjelenit();
        }
    </script>
</body>
</html>
